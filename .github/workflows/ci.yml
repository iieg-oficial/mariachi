name: CI

on:
  push:
    branches-ignore: [production]
    paths-ignore: ['**.md', 'docs/**', '.gitignore', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', '.gitignore', 'LICENSE']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    uses: ./.github/workflows/test-backend.yml

  admin:
    uses: ./.github/workflows/test-frontend.yml
    with:
      app: admin
