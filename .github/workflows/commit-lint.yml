name: Validate Commits

on: [pull_request]

jobs:
  commit-lint:
    runs-on: [self-hosted, linux, iieg]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate Conventional Commits
        run: |
          commits=$(git log --format=%s --no-merges origin/${{ github.base_ref }}..HEAD)

          regex="^(merge|build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9\-]+\))?: .+"
          error=0

          while read -r msg; do
            if [ -z "$msg" ]; then
              continue
            fi
            if echo "$msg" | grep -E -q "^Merge "; then
              continue
            fi
            if [[ ! "$msg" =~ $regex ]]; then
              echo "El mensaje no sigue Conventional Commits: '$msg'"
              error=1
            else
              echo "Valido: '$msg'"
            fi
          done <<< "$commits"

          if [ $error -eq 1 ]; then
            echo ""
            echo "Formato: <tipo>[(ambito opcional)]: <descripcion>"
            echo "Tipos: merge, build, chore, ci, docs, feat, fix, perf, refactor, revert, style, test"
            echo "Ambitos comunes: api, admin, web, nginx, docker, db, auth, layers, etc."
            echo ""
            echo "Ejemplo sin ambito:  feat: add login form"
            echo "Ejemplo con ambito:  feat(auth): add login form"
            exit 1
          fi
