name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    uses: ./.github/workflows/test-backend.yml

  admin:
    uses: ./.github/workflows/test-frontend.yml
    with:
      app: admin

  notify:
    needs: [backend, admin]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Status
        run: |
          echo "backend: ${{ needs.backend.result }}"
          echo "admin: ${{ needs.admin.result }}"

      - name: Notify Discord - Failure
        if: needs.backend.result != 'success' || needs.admin.result != 'success'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          COMMIT_MSG=$(echo '${{ github.event.head_commit.message }}' | head -1)
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          FAILED_JOBS=""
          [ "${{ needs.backend.result }}" != "success" ] && FAILED_JOBS="${FAILED_JOBS}backend(${{ needs.backend.result }}) "
          [ "${{ needs.admin.result }}" != "success" ] && FAILED_JOBS="${FAILED_JOBS}admin(${{ needs.admin.result }}) "
          [ -z "$FAILED_JOBS" ] && FAILED_JOBS="(unknown)"

          curl -sf -H "Content-Type: application/json" -d '{
            "embeds": [{
              "title": "CI fallido — mariachi",
              "color": 15158332,
              "fields": [
                { "name": "Commit", "value": "[`'"${GITHUB_SHA::7}"'`]('"$COMMIT_URL"')", "inline": true },
                { "name": "Autor", "value": "${{ github.actor }}", "inline": true },
                { "name": "Branch", "value": "`${{ github.ref_name }}`", "inline": true },
                { "name": "Jobs fallidos", "value": "'"$FAILED_JOBS"'" },
                { "name": "Cambios", "value": "'"$COMMIT_MSG"'" },
                { "name": "Workflow", "value": "[Ver logs]('"$RUN_URL"')", "inline": true }
              ],
              "footer": { "text": "iieg-oficial/mariachi" },
              "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"
            }]
          }' "$DISCORD_WEBHOOK"
