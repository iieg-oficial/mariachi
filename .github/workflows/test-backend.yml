name: Test Backend

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Tests
        env:
          PROJECT_NAME: mariachi-test
          VERSION: 0.0.0-test
          DATABASE_URL: sqlite:///:memory:
          SECRET_KEY: test-secret-key-do-not-use-in-production
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
          REDIS_URL: redis://localhost:6379/0
          ACERVO_ENDPOINT: localhost:9000
          ACERVO_PUBLIC_ENDPOINT: localhost:9000
          ACERVO_ACCESS_KEY: test-access-key
          ACERVO_SECRET_KEY: test-secret-key
          ACERVO_BUCKET_NAME: test-bucket
          ACERVO_USE_SSL: 'false'
          CORS_ORIGINS: '["http://localhost:3000"]'
          ADMIN_PREFIX: /api/administrador
          WEB_PREFIX: /api/portal
          COOKIE_NAME: access_token
          COOKIE_MAX_AGE: 1800
          COOKIE_SECURE: 'false'
          COOKIE_HTTPONLY: 'true'
          COOKIE_SAMESITE: lax
          CSRF_SECRET_KEY: test-csrf-secret-key-do-not-use-in-production
          CSRF_TOKEN_EXPIRE_MINUTES: 60
        run: pytest -q
