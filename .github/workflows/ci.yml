name: CI

on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**', '.gitignore', 'LICENSE']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  alcance:
    runs-on: [self-hosted, linux, iieg]
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.abierto.outputs.si == 'true' && steps.carpetas.outputs.api || 'false' }}
      admin: ${{ steps.abierto.outputs.si == 'true' && steps.carpetas.outputs.admin || 'false' }}
    steps:
      - id: abierto
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          estado=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json state -q .state)
          echo "PR #$PR: $estado"
          echo "si=$([ "$estado" = OPEN ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: carpetas
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: bash .github/scripts/carpetas-cambiadas.sh api admin

  backend:
    needs: alcance
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/test-backend.yml
    with:
      correr: ${{ needs.alcance.outputs.api != 'false' }}

  admin:
    needs: alcance
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/test-frontend.yml
    with:
      app: admin
      correr: ${{ needs.alcance.outputs.admin != 'false' }}
      relacionados: ${{ github.base_ref == 'develop' }}
