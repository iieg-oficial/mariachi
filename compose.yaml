x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck: &healthcheck
  interval: 3s
  timeout: 5s
  retries: 10

x-host-gateway: &host-gateway
  - "host.docker.internal:host-gateway"

services:
  postgres:
    image: postgres:18-alpine
    command: ["postgres",
              "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:?}",
              "-c", "shared_buffers=${POSTGRES_SHARED_BUFFERS:?}",
              "-c", "effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:?}"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      <<: *healthcheck
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?} -d ${POSTGRES_DB:?}" ]
      start_period: 5s
    networks:
      - mariachi_network
    logging: *logging

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      <<: *healthcheck
      test: [ "CMD", "redis-cli", "ping" ]
      start_period: 2s
    networks:
      - mariachi_network
    logging: *logging

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    command: ./scripts/start_backend.sh
    volumes:
      - ./docs/CHANGELOG.md:/app/_docs/CHANGELOG.md:ro
    extra_hosts: *host-gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      REDIS_URL: redis://redis:6379/0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=15).read()"]
      interval: 15s
      timeout: 20s
      retries: 5
      start_period: 120s
    networks:
      - mariachi_network
    logging: *logging

volumes:
  postgres_data:
  redis_data:

networks:
  mariachi_network:
    driver: bridge
