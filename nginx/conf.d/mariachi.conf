upstream mariachi_api {
    server mariachi-api:8000;
    keepalive 32;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    ~. $http_x_forwarded_proto;
}

map $http_x_forwarded_host $forwarded_host {
    default $host;
    ~. $http_x_forwarded_host;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /api/administrador/media/ {
        proxy_pass http://mariachi_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /api/ {
        proxy_pass http://mariachi_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-store" always;
    }

    location /mariachi {
        alias /usr/share/nginx/html/mariachi;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /mariachi/index.html;
    }

    location ^~ /colibri/widget/ {
        alias /usr/share/nginx/html/colibri-widget/;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff";
        types {
            application/javascript js;
            application/json map;
        }
    }

    location ^~ /colibri/docs {
        alias /usr/share/nginx/html/colibri-docs;
        index index.html;
        try_files $uri $uri/ $uri/index.html =404;
        add_header Cache-Control "public, max-age=300";
    }

    location /administrador {
        return 301 /mariachi$request_uri;
    }

    location = / {
        return 302 /mariachi/;
    }
}
