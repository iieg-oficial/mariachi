name: Notify CI

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [production]

jobs:
  notify:
    if: |
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Compute commit metadata
        id: meta
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          MSG=$(git log -1 --pretty=%s "$SHA" 2>/dev/null || echo "${{ github.event.workflow_run.display_title }}")
          MSG_ESC=$(printf '%s' "$MSG" | sed 's/"/\\"/g')
          echo "msg=$MSG_ESC" >> "$GITHUB_OUTPUT"

          NEW=$(grep '^version' api/pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          OLD=$(git show HEAD~1:api/pyproject.toml 2>/dev/null | grep '^version' | head -1 | sed -E 's/.*"([^"]+)".*/\1/' || true)
          if [ -z "$OLD" ] || [ "$NEW" = "$OLD" ]; then
            TRANS="$NEW (sin bump)"
          else
            TRANS="$OLD → $NEW"
          fi
          echo "version=$TRANS" >> "$GITHUB_OUTPUT"

      - name: Notify Discord - Success
        if: github.event.workflow_run.conclusion == 'success'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.workflow_run.head_sha }}"
          RUN_URL="${{ github.event.workflow_run.html_url }}"

          curl -sf -H "Content-Type: application/json" -d '{
            "embeds": [{
              "title": "CI exitoso",
              "color": 3066993,
              "fields": [
                { "name": "Commit", "value": "[`${{ steps.meta.outputs.short }}`]('"$COMMIT_URL"')", "inline": true },
                { "name": "Autor", "value": "${{ github.event.workflow_run.actor.login }}", "inline": true },
                { "name": "Branch", "value": "`${{ github.event.workflow_run.head_branch }}`", "inline": true },
                { "name": "Version", "value": "🟢 `${{ steps.meta.outputs.version }}`", "inline": true },
                { "name": "Workflow", "value": "[Ver ejecución]('"$RUN_URL"')", "inline": true },
                { "name": "Cambios", "value": "${{ steps.meta.outputs.msg }}" }
              ],
              "footer": { "text": "iieg-oficial/mariachi" },
              "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"
            }]
          }' "$DISCORD_WEBHOOK"

      - name: Notify Discord - Failure
        if: github.event.workflow_run.conclusion == 'failure'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.workflow_run.head_sha }}"
          RUN_URL="${{ github.event.workflow_run.html_url }}"

          curl -sf -H "Content-Type: application/json" -d '{
            "embeds": [{
              "title": "CI fallido",
              "color": 15158332,
              "fields": [
                { "name": "Commit", "value": "[`${{ steps.meta.outputs.short }}`]('"$COMMIT_URL"')", "inline": true },
                { "name": "Autor", "value": "${{ github.event.workflow_run.actor.login }}", "inline": true },
                { "name": "Branch", "value": "`${{ github.event.workflow_run.head_branch }}`", "inline": true },
                { "name": "Version", "value": "🔴 `${{ steps.meta.outputs.version }}`", "inline": true },
                { "name": "Workflow", "value": "[Ver ejecución]('"$RUN_URL"')", "inline": true },
                { "name": "Cambios", "value": "${{ steps.meta.outputs.msg }}" }
              ],
              "footer": { "text": "iieg-oficial/mariachi" },
              "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"
            }]
          }' "$DISCORD_WEBHOOK"
