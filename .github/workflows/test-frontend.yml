name: Test Frontend

on:
  workflow_call:
    inputs:
      app:
        description: 'Subcarpeta del frontend a testear (admin o web)'
        required: true
        type: string
      correr:
        description: 'false salta los tests (no cambió la app)'
        required: false
        type: boolean
        default: true
      relacionados:
        description: 'true corre solo los tests afectados por el PR; la suite completa queda para production'
        required: false
        type: boolean
        default: false

jobs:
  test:
    if: ${{ inputs.correr }}
    runs-on: [self-hosted, linux, iieg]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./${{ inputs.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: ${{ inputs.relacionados && '0' || '1' }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Restaurar node_modules
        id: nm
        env:
          LLAVE: ${{ github.event.repository.name }}-${{ inputs.app }}-node26-${{ hashFiles(format('{0}/package-lock.json', inputs.app)) }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/node-modules.sh" restaurar "$LLAVE"

      - name: Install dependencies
        if: steps.nm.outputs.hit != 'true'
        run: npm ci

      - name: Guardar node_modules
        if: steps.nm.outputs.hit != 'true'
        env:
          LLAVE: ${{ github.event.repository.name }}-${{ inputs.app }}-node26-${{ hashFiles(format('{0}/package-lock.json', inputs.app)) }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/node-modules.sh" guardar "$LLAVE"

      - name: Lint
        env:
          LLAVE: ${{ github.event.repository.name }}-${{ inputs.app }}
        run: npm run lint -- --cache --cache-strategy content --cache-location "$HOME/.cache/ci-eslint/$LLAVE/"

      - name: Test (if present)
        env:
          RELACIONADOS: ${{ inputs.relacionados }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$RELACIONADOS" = "true" ] && [ -n "$BASE" ]; then
            npx vitest run --changed "$BASE" --passWithNoTests
          else
            npm test --if-present
          fi

      - name: Dead code check (if present)
        run: npm run check:dead-code:strict --if-present

      - name: Build
        env:
          VITE_WEB_API_URL: http://localhost:8000/api/portal
          VITE_ADMIN_API_URL: http://localhost:8000/api/administrador
          VITE_API_TIMEOUT: 10000
          VITE_ADMIN_API_TIMEOUT: 10000
          VITE_APP_NAME: Portal
          VITE_ADMIN_APP_NAME: Admin
          VITE_NODE_ENV: production
        run: npm run build
