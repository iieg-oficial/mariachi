name: Notify CI Failure

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  notify:
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'production'
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord - CI Failure
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN: ${{ toJSON(github.event.workflow_run) }}
        run: |
          COMMIT_MSG=$(echo "$RUN" | python3 -c "import json,sys; print(json.load(sys.stdin).get('head_commit',{}).get('message','').splitlines()[0] if json.load(sys.stdin) else '')" 2>/dev/null || echo "${{ github.event.workflow_run.display_title }}")
          COMMIT_SHA="${{ github.event.workflow_run.head_sha }}"
          COMMIT_SHORT="${COMMIT_SHA:0:7}"
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${COMMIT_SHA}"
          RUN_URL="${{ github.event.workflow_run.html_url }}"
          AUTHOR="${{ github.event.workflow_run.actor.login }}"
          BRANCH="${{ github.event.workflow_run.head_branch }}"

          curl -sf -H "Content-Type: application/json" -d '{
            "embeds": [{
              "title": "CI fallido — mariachi",
              "color": 15158332,
              "fields": [
                { "name": "Commit", "value": "[`'"$COMMIT_SHORT"'`]('"$COMMIT_URL"')", "inline": true },
                { "name": "Autor", "value": "'"$AUTHOR"'", "inline": true },
                { "name": "Branch", "value": "`'"$BRANCH"'`", "inline": true },
                { "name": "Cambios", "value": "'"$COMMIT_MSG"'" },
                { "name": "Workflow", "value": "[Ver logs]('"$RUN_URL"')", "inline": true }
              ],
              "footer": { "text": "iieg-oficial/mariachi" },
              "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"
            }]
          }' "$DISCORD_WEBHOOK"
