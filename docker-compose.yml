name: mariachi

services:
  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
      args:
        VITE_NODE_ENV: ${VITE_NODE_ENV:-production}
        VITE_ADMIN_API_URL: ${VITE_ADMIN_API_URL:-/api/administrador}
        VITE_WEB_URL: ${VITE_WEB_URL:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
        SENTRY_ORG: ${SENTRY_ORG:-}
        SENTRY_PROJECT: ${SENTRY_PROJECT:-}
        BUILD_STATS: ${BUILD_STATS:-}
    container_name: mariachi-nginx
    expose:
      - "80"
    depends_on:
      - api
    networks:
      - mariachi_network
      - iieg-network
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    container_name: mariachi-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iieg_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iieg_password}
      POSTGRES_DB: ${POSTGRES_DB:-iieg_portal}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iieg_user} -d ${POSTGRES_DB:-iieg_portal}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mariachi_network

  redis:
    image: redis:7-alpine
    container_name: mariachi-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mariachi_network

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: production
    container_name: mariachi-api
    command: ./scripts/start_backend.sh
    env_file:
      - ${API_ENV_FILE:-./.env.staging}
    volumes:
      - ./api:/app
      - ./docs/CHANGELOG.md:/app/_docs/CHANGELOG.md:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-iieg_user}:${POSTGRES_PASSWORD:-iieg_password}@postgres:5432/${POSTGRES_DB:-iieg_portal}
      REDIS_URL: redis://redis:6379/0
      ACERVO_USE_SSL: ${ACERVO_USE_SSL:-false}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
    networks:
      - mariachi_network
      - iieg-network

volumes:
  postgres_data:
  redis_data:

networks:
  mariachi_network:
    driver: bridge
  iieg-network:
    external: true
