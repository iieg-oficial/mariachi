name: portal-dev

services:
  postgres:
    image: postgres:18-alpine
    container_name: portal-postgres-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iieg_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iieg_password}
      POSTGRES_DB: ${POSTGRES_DB:-iieg_portal}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iieg_user} -d ${POSTGRES_DB:-iieg_portal}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - portal_network_dev

  redis:
    image: redis:8-alpine
    container_name: portal-redis-dev
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - portal_network_dev

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: portal-api-dev
    command: ./scripts/start_backend.sh
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - ./.env.development
    volumes:
      - ./api:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-iieg_user}:${POSTGRES_PASSWORD:-iieg_password}@postgres:5432/${POSTGRES_DB:-iieg_portal}
      REDIS_URL: redis://redis:6379/0
      ACERVO_ENDPOINT: ${ACERVO_ENDPOINT}
      ACERVO_PUBLIC_ENDPOINT: ${ACERVO_PUBLIC_ENDPOINT}
      ACERVO_ACCESS_KEY: ${ACERVO_ACCESS_KEY}
      ACERVO_SECRET_KEY: ${ACERVO_SECRET_KEY}
      ACERVO_BUCKET_NAME: ${ACERVO_BUCKET_NAME:-iieg-media}
      ACERVO_USE_SSL: ${ACERVO_USE_SSL:-false}
    networks:
      - portal_network_dev

  web:
    image: node:24-alpine
    container_name: portal-web-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "${WEB_PORT:-3010}:3010"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    env_file:
      - ./.env.development
    environment:
      - VITE_PORT=3010
      - VITE_GOOGLE_ANALYTICS_ID=${VITE_GOOGLE_ANALYTICS_ID}
    networks:
      - portal_network_dev

  admin:
    image: node:24-alpine
    container_name: portal-admin-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "${ADMIN_PORT:-3011}:3011"
    volumes:
      - ./admin:/app
      - admin_node_modules:/app/node_modules
    env_file:
      - ./.env.development
    environment:
      - VITE_PORT=3011
      - VITE_GOOGLE_ANALYTICS_ID=${VITE_GOOGLE_ANALYTICS_ID}
    networks:
      - portal_network_dev

volumes:
  postgres_data_dev:
  redis_data_dev:
  web_node_modules:
  admin_node_modules:


networks:
  portal_network_dev:
    driver: bridge
