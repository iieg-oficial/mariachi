name: mariachi-dev

services:
  postgres:
    build:
      dockerfile_inline: |
        FROM postgres:18-alpine
    image: mariachi-postgres-dev
    container_name: mariachi-postgres-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?} -d ${POSTGRES_DB:?}" ]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - mariachi_network_dev

  redis:
    build:
      dockerfile_inline: |
        FROM redis:8-alpine
    image: mariachi-redis-dev
    container_name: mariachi-redis-dev
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 2s
    networks:
      - mariachi_network_dev

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: development
    image: mariachi-api-dev
    container_name: mariachi-api-dev
    command: ./scripts/start_backend.sh
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - ./.env.development
    volumes:
      - ./api:/app
      - ./docs:/app/_docs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      REDIS_URL: redis://redis:6379/0
      ACERVO_ENDPOINT: ${ACERVO_ENDPOINT}
      ACERVO_PUBLIC_ENDPOINT: ${ACERVO_PUBLIC_ENDPOINT}
      ACERVO_USE_SSL: ${ACERVO_USE_SSL:-false}
      ACERVO_VERIFY_SSL: ${ACERVO_VERIFY_SSL:-true}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-1.0}
    networks:
      - mariachi_network_dev
      - dataengine-network
      - acervo_network_dev

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile.dev
    image: mariachi-admin-dev
    container_name: mariachi-admin-dev
    working_dir: /app
    ports:
      - "${ADMIN_PORT:-3011}:3011"
    volumes:
      - ./admin:/app
      - admin_node_modules:/app/node_modules
    env_file:
      - ./.env.development
    environment:
      - VITE_PORT=3011
      - VITE_GOOGLE_ANALYTICS_ID=${VITE_GOOGLE_ANALYTICS_ID}
      - VITE_MAPALAB_PROXY_URL=${VITE_MAPALAB_PROXY_URL:-http://mapalab-dev-frontend-1:3006}
    networks:
      - mariachi_network_dev
      - mapalab-network

volumes:
  postgres_data_dev:
  redis_data_dev:
  admin_node_modules:


networks:
  mariachi_network_dev:
    driver: bridge
  mapalab-network:
    external: true
  dataengine-network:
    external: true
  acervo_network_dev:
    name: acervo-dev_acervo_network_dev
    external: true
