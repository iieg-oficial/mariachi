[project]
name = "mariachi-api"
version = "1.27.0"
description = "Mariachi — backend API del ecosistema IIEG (admin, MapaLab, SIEEJ)."
authors = [{name = "Edgar Alejandro Villarreal Padilla", email = "edgar.villarreal@iieg.gob.mx"}]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111,<0.113",
    "uvicorn[standard]>=0.23,<1.0",
    "gunicorn>=22.0,<24.0",
    "pydantic>=2.5,<3.0",
    "pydantic-settings>=2.2,<2.5",
    "pydantic[email]>=2.5",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<1.14",
    "psycopg2-binary>=2.9,<3.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "passlib[bcrypt]>=1.7,<2.0",
    "bcrypt>=3.2,<4.0",
    "python-multipart>=0.0.9",
    "redis>=5.0,<6.0",
    "minio>=7.2,<8.0",
    "python-dotenv>=1.0,<2.0",
    "httpx>=0.26,<0.28",
    "sentry-sdk[fastapi]>=2.0,<3.0",
    "coloredlogs>=15.0,<16.0",
    "rich>=13.7,<14.0",
    "prometheus-fastapi-instrumentator>=7.0,<8.0",
    "openpyxl>=3.1,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=4.1,<5.0",
    "ruff>=0.3,<1.0",
    "mypy>=1.9,<2.0",
]

[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "scripts*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/models/layer.py" = ["I001"]
"app/services/layer_service.py" = ["I001"]
"app/services/mapalab_notifier.py" = ["I001"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
