name: Auto PR to Production

on:
  push:
    branches: [develop]
    paths-ignore: ['**.md', 'docs/**', '.gitignore', 'LICENSE']

concurrency:
  group: auto-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  backend:
    uses: ./.github/workflows/test-backend.yml

  admin:
    uses: ./.github/workflows/test-frontend.yml
    with:
      app: admin

  create-pr:
    needs: [backend, admin]
    runs-on: [self-hosted, linux, iieg]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create or update PR
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          AHEAD=$(gh api "repos/${{ github.repository }}/compare/production...develop" --jq '.ahead_by')
          if [ "$AHEAD" -eq 0 ]; then
            echo "develop no tiene commits por delante de production; nada que integrar."
            exit 0
          fi

          EXISTING_PR=$(gh pr list --base production --head develop --state open --json number --jq '.[0].number')

          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR ya existe, actualizando..."
            gh pr edit "$EXISTING_PR" \
              --title "chore: auto-merge develop into production" \
              --body "$(cat <<'EOF'
          ## Auto-merge

          PR generado automaticamente al pasar los tests en develop.

          **Ultimo commit:** ${{ github.sha }}
          **Autor:** ${{ github.actor }}
          EOF
          )"
          else
            echo "Creando nuevo PR..."
            gh pr create \
              --base production \
              --head develop \
              --title "chore: auto-merge develop into production" \
              --body "$(cat <<'EOF'
          ## Auto-merge

          PR generado automaticamente al pasar los tests en develop.

          **Ultimo commit:** ${{ github.sha }}
          **Autor:** ${{ github.actor }}
          EOF
          )"
          fi

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list --base production --head develop --state open --json number --jq '.[0].number')
          if [ -n "$PR_NUMBER" ]; then
            for i in 1 2 3; do
              gh pr merge "$PR_NUMBER" --auto --merge && break
              echo "Intento $i fallido, esperando 30s..."
              sleep 30
            done
            echo "Auto-merge procesado en PR #$PR_NUMBER"
          fi
