name: mariachi

services:
  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
      args:
        VITE_NODE_ENV: ${VITE_NODE_ENV:-production}
        VITE_GOOGLE_ANALYTICS_ID: ${VITE_GOOGLE_ANALYTICS_ID:-}
        VITE_ADMIN_API_URL: ${VITE_ADMIN_API_URL}
        VITE_ADMIN_API_TIMEOUT: ${VITE_ADMIN_API_TIMEOUT:-10000}
        VITE_ADMIN_APP_NAME: ${VITE_ADMIN_APP_NAME:-Mariachi}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
        SENTRY_ORG: ${SENTRY_ORG:-}
        SENTRY_PROJECT: ${SENTRY_PROJECT:-}
    container_name: mariachi-nginx
    expose:
      - "80"
    depends_on:
      - api
    volumes:
      # SIEEJ frontend (otro repo) construye su dist con `make build` y mariachi-nginx lo sirve en /sieej/.
      # Ver ../SIEEJ/README.md y mariachi/docs/context.md.
      - ${SIEEJ_DIST_PATH:-../SIEEJ/frontend/dist}:/usr/share/nginx/html/sieej:ro
    networks:
      - mariachi_network
      - iieg-network
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    container_name: mariachi-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iieg_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iieg_password}
      POSTGRES_DB: ${POSTGRES_DB:-iieg_portal}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iieg_user} -d ${POSTGRES_DB:-iieg_portal}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mariachi_network

  redis:
    image: redis:7-alpine
    container_name: mariachi-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mariachi_network

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: production
    container_name: mariachi-api
    command: ./scripts/start_backend.sh
    env_file:
      - ${API_ENV_FILE:-./.env.staging}
    volumes:
      - ./api:/app
      - ../acervo/nginx/ssl/acervo.crt:/usr/local/share/ca-certificates/acervo.crt:ro
      - ./docs/CHANGELOG.md:/app/_docs/CHANGELOG.md:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-iieg_user}:${POSTGRES_PASSWORD:-iieg_password}@postgres:5432/${POSTGRES_DB:-iieg_portal}
      REDIS_URL: redis://redis:6379/0
      ACERVO_ENDPOINT: ${ACERVO_ENDPOINT}
      ACERVO_PUBLIC_ENDPOINT: ${ACERVO_PUBLIC_ENDPOINT}
      ACERVO_ACCESS_KEY: ${ACERVO_ACCESS_KEY}
      ACERVO_SECRET_KEY: ${ACERVO_SECRET_KEY}
      ACERVO_BUCKET_NAME: ${ACERVO_BUCKET_NAME:-iieg-acervo}
      ACERVO_USE_SSL: ${ACERVO_USE_SSL:-false}
      REQUESTS_CA_BUNDLE: /usr/local/share/ca-certificates/acervo.crt
      SSL_CERT_FILE: /usr/local/share/ca-certificates/acervo.crt
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
    networks:
      - mariachi_network
      - iieg-network

volumes:
  postgres_data:
  redis_data:

networks:
  mariachi_network:
    driver: bridge
  iieg-network:
    external: true
