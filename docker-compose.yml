name: portal

services:
  nginx:
    image: nginx:alpine
    container_name: portal-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
      - admin
      - api
    networks:
      - portal_network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: portal-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iieg_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iieg_password}
      POSTGRES_DB: ${POSTGRES_DB:-iieg_portal}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iieg_user} -d ${POSTGRES_DB:-iieg_portal}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - portal_network

  redis:
    image: redis:7-alpine
    container_name: portal-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - portal_network

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: portal-api
    command: ./scripts/start_backend.sh
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - ./.env
    extra_hosts:
      - "${S3_DOMAIN:-s3.jalisco.gob.mx}:${S3_HOST_IP:-host-gateway}"
    volumes:
      - ./api:/app
      - ./nginx/ssl/${S3_DOMAIN:-s3.jalisco.gob.mx}.crt:/usr/local/share/ca-certificates/${S3_DOMAIN:-s3.jalisco.gob.mx}.crt:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-iieg_user}:${POSTGRES_PASSWORD:-iieg_password}@postgres:5432/${POSTGRES_DB:-iieg_portal}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-iieg-media}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      REQUESTS_CA_BUNDLE: /usr/local/share/ca-certificates/${S3_DOMAIN:-s3.jalisco.gob.mx}.crt
      SSL_CERT_FILE: /usr/local/share/ca-certificates/${S3_DOMAIN:-s3.jalisco.gob.mx}.crt
    networks:
      - portal_network

  web:
    build:
      context: .
      dockerfile: ./web/Dockerfile.prod
      args:
        VITE_NODE_ENV: ${VITE_NODE_ENV:-production}
        VITE_GOOGLE_ANALYTICS_ID: ${VITE_GOOGLE_ANALYTICS_ID:-}
    container_name: portal-web
    restart: unless-stopped
    networks:
      - portal_network

  admin:
    build:
      context: .
      dockerfile: ./admin/Dockerfile.prod
      args:
        VITE_NODE_ENV: ${VITE_NODE_ENV:-production}
        VITE_GOOGLE_ANALYTICS_ID: ${VITE_GOOGLE_ANALYTICS_ID:-}
    container_name: portal-admin
    restart: unless-stopped
    networks:
      - portal_network

volumes:
  postgres_data:
  redis_data:


networks:
  portal_network:
    driver: bridge
