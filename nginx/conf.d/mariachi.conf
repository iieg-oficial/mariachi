map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    ~. $http_x_forwarded_proto;
}

map $http_x_forwarded_host $forwarded_host {
    default $host;
    ~. $http_x_forwarded_host;
}

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/includes/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        access_log off;
        include /etc/nginx/includes/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /acervo/thumb/ {
        set $mariachi_api "mariachi-api:8000";
        proxy_pass http://$mariachi_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location ^~ /api/mariachi/acervo {
        set $mariachi_api "mariachi-api:8000";
        proxy_pass http://$mariachi_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
        proxy_buffering off;
        include /etc/nginx/includes/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /api/administrador/acervo {
        set $mariachi_api "mariachi-api:8000";
        rewrite ^/api/administrador/(.*)$ /api/mariachi/$1 break;
        proxy_pass http://$mariachi_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
        proxy_buffering off;
        include /etc/nginx/includes/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /api/administrador/ {
        set $mariachi_api "mariachi-api:8000";
        rewrite ^/api/administrador/(.*)$ /api/mariachi/$1 break;
        proxy_pass http://$mariachi_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        include /etc/nginx/includes/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /api/mariachi/geoserver/files {
        set $mariachi_api "mariachi-api:8000";
        proxy_pass http://$mariachi_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_connect_timeout 10s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location ^~ /api/administrador/geoserver/files {
        set $mariachi_api "mariachi-api:8000";
        rewrite ^/api/administrador/(.*)$ /api/mariachi/$1 break;
        proxy_pass http://$mariachi_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_connect_timeout 10s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location ^~ /api/ {
        set $mariachi_api "mariachi-api:8000";
        proxy_pass http://$mariachi_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        include /etc/nginx/includes/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location /mariachi {
        alias /usr/share/nginx/html/mariachi;
        include /etc/nginx/includes/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /mariachi/index.html;
    }

    location ^~ /colibri/widget/ {
        alias /usr/share/nginx/html/colibri-widget/;
        include /etc/nginx/includes/security-headers.conf;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=86400";
        types {
            application/javascript js;
            application/json map;
        }
    }

    location = / {
        return 302 /mariachi/;
    }
}
