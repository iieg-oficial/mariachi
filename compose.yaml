x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck: &healthcheck
  interval: 3s
  timeout: 5s
  retries: 10

x-host-gateway: &host-gateway
  - "host.docker.internal:host-gateway"

services:
  postgres:
    image: postgres:18-alpine
    command: ["postgres",
              "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:?}",
              "-c", "shared_buffers=${POSTGRES_SHARED_BUFFERS:?}",
              "-c", "effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:?}"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:?}
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      <<: *healthcheck
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?} -d ${POSTGRES_DB:?}" ]
      start_period: 5s
    networks:
      - mariachi_network
    logging: *logging

  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "exec docker-entrypoint.sh redis-server --requirepass \"$$(cat /run/secrets/redis_password)\""]
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    healthcheck:
      <<: *healthcheck
      test: [ "CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli ping | grep -q PONG" ]
      start_period: 2s
    networks:
      - mariachi_network
    logging: *logging

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    command: ./scripts/start_backend.sh
    volumes:
      - ./docs/CHANGELOG.md:/app/_docs/CHANGELOG.md:ro
    extra_hosts: *host-gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?}
      REDIS_URL: redis://redis:6379/0
    secrets:
      - postgres_password
      - secret_key
      - csrf_secret_key
      - redis_password
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=15).read()"]
      interval: 15s
      timeout: 20s
      retries: 5
      start_period: 120s
    networks:
      - mariachi_network
    logging: *logging

volumes:
  postgres_data:
  redis_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  secret_key:
    file: ./secrets/secret_key
  csrf_secret_key:
    file: ./secrets/csrf_secret_key
  redis_password:
    file: ./secrets/redis_password

networks:
  mariachi_network:
    driver: bridge
