name: mariachi

services:
  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
      args:
        VITE_NODE_ENV: ${VITE_NODE_ENV:?}
        VITE_ADMIN_API_URL: ${VITE_ADMIN_API_URL:?}
        VITE_WEB_URL: ${VITE_WEB_URL}
    container_name: mariachi-nginx
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - mariachi_network
      - iieg-network
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    container_name: mariachi-postgres
    command: ["postgres",
              "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS}",
              "-c", "shared_buffers=${POSTGRES_SHARED_BUFFERS}",
              "-c", "effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE}"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?} -d ${POSTGRES_DB:?}" ]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - mariachi_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mariachi-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 2s
    networks:
      - mariachi_network
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: production
    image: mariachi-api
    container_name: mariachi-api
    command: ./scripts/start_backend.sh
    env_file:
      - ${API_ENV_FILE:?}
    volumes:
      - ./docs/CHANGELOG.md:/app/_docs/CHANGELOG.md:ro
      - geoserver_uploads:/var/tmp/geoserver-uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      REDIS_URL: redis://redis:6379/0
      ACERVO_USE_SSL: ${ACERVO_USE_SSL:?}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=15).read()"]
      interval: 15s
      timeout: 20s
      retries: 5
      start_period: 120s
    networks:
      - mariachi_network
      - iieg-network
    restart: unless-stopped

  cron-sieej:
    image: mariachi-api
    container_name: mariachi-cron-sieej
    command:
      - sh
      - -c
      - |
        while true; do
          echo "[cron-sieej] $$(date -u +%Y-%m-%dT%H:%M:%SZ) running sieej_periodos_tick"
          python scripts/sieej_periodos_tick.py || echo "[cron-sieej] tick periodos fallo, continuando"
          echo "[cron-sieej] $$(date -u +%Y-%m-%dT%H:%M:%SZ) running expire_sieej_envios"
          python scripts/expire_sieej_envios.py || echo "[cron-sieej] script fallo, continuando"
          echo "[cron-sieej] $$(date -u +%Y-%m-%dT%H:%M:%SZ) running purge_mapalab_accesos"
          python scripts/purge_mapalab_accesos.py || echo "[cron-sieej] purge mapalab fallo, continuando"
          echo "[cron-sieej] $$(date -u +%Y-%m-%dT%H:%M:%SZ) running refresh_mapalab_stats"
          python scripts/refresh_mapalab_stats.py || echo "[cron-sieej] refresh stats fallo, continuando"
          sleep ${CRON_SIEEJ_EXPIRE_INTERVAL:?}
        done
    env_file:
      - ${API_ENV_FILE:?}
    depends_on:
      api:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      REDIS_URL: redis://redis:6379/0
    networks:
      - mariachi_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  geoserver_uploads:

networks:
  mariachi_network:
    driver: bridge
  iieg-network:
    external: true
